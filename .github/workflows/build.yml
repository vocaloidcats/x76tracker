# Builds x76tracker.exe on GitHub's own Windows machines, straight from this repository.
#
# - Every push and pull request: build and test, and keep the exe as a downloadable artifact.
# - A version tag (v2.1.0, ...): the same, plus a signed build attestation and a GitHub release
#   with the exe and its SHA-256. Anyone can check a download came from this workflow with
#   `gh attestation verify x76tracker.exe --repo vocaloidcats/x76tracker`.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The exact compiler the release is built with. Bump it here when you update Rust.
  RUST_VERSION: "1.100.0"
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # create the release (tags only)
      id-token: write # sign the build attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
          rustc --version

      - name: Tag matches Cargo.toml, and CHANGELOG.md has its notes
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG doesn't match the version in Cargo.toml ($v)." }
          # the "## <version>" section of CHANGELOG.md becomes the release notes (the app shows the same text)
          $lines = @(Get-Content CHANGELOG.md -Encoding utf8)
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match "^## v?$([regex]::Escape($v))\s*$") { $start = $i; break } }
          if ($start -lt 0) { throw "CHANGELOG.md has no '## $v' section. Add one before tagging." }
          $notes = @()
          for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -notmatch '^## '; $i++) { $notes += $lines[$i] }
          $text = ($notes -join "`n").Trim()
          # pictures are paths in the repository; release notes need full addresses (at this tag)
          $text = $text -replace '\]\((?!https?://)([^)\s]+)\)', ('](https://raw.githubusercontent.com/vocaloidcats/x76tracker/' + $env:TAG + '/$1)')
          $text | Out-File -Encoding utf8 release-notes.md

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: SHA-256
        run: |
          $hash = (Get-FileHash target/release/x76tracker.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  x76tracker.exe" | Out-File -Encoding ascii target/release/x76tracker.exe.sha256
          "**x76tracker.exe** SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/release/x76tracker.exe

      - uses: actions/upload-artifact@v7
        with:
          name: x76tracker-${{ github.sha }}
          path: |
            target/release/x76tracker.exe
            target/release/x76tracker.exe.sha256

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:TAG target/release/x76tracker.exe target/release/x76tracker.exe.sha256 `
            --title "x76tracker $env:TAG" --notes-file release-notes.md --verify-tag
