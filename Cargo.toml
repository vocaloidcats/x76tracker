[package]
name = "x76tracker"
version = "2.2.2"
edition = "2021"
publish = false
description = "x76tracker: unofficial live Elo/points tracker for the x76.gg Quake Live and R5Reloaded ladders"
license = "MIT"

[[bin]]
name = "x76tracker"
path = "src/main.rs"

[dependencies]
# Software renderer only: Slint's GPU renderer (femtovg) drew some letters a pixel off the baseline.
slint = { version = "1", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    # access to the native window: custom title bar (drag, snap, resize), rounded corners, shadow
    "unstable-winit-030",
] }
# Windows' own TLS (SChannel) instead of bundling a crypto library; gzip keeps downloads ~0.5 MB.
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# avatar and banner pictures from x76 profiles (WebP), plus PNG/JPEG just in case
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg"] }
png = "0.17"
# checks update downloads against the SHA-256 published with each release
sha2 = "0.10"

[features]
# --screenshot and its options (recording, previews, clicks): for making the README and changelog
# pictures. Release builds leave them out: `cargo build --release --features docs` to get them.
docs = []

[build-dependencies]
slint-build = "1"
winresource = "0.1"

[profile.release]
strip = true
